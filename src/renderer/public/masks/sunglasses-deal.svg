<svg xmlns="http://www.w3.org/2000/svg" width="512" height="176" viewBox="0 0 512 176">
  <defs>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a44" />
      <stop offset="0.45" stop-color="#141418" />
      <stop offset="1" stop-color="#060608" />
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- дужки -->
  <rect x="0" y="44" width="26" height="22" rx="6" fill="#0b0b0e" />
  <rect x="486" y="44" width="26" height="22" rx="6" fill="#0b0b0e" />

  <!-- перенісся -->
  <rect x="214" y="52" width="84" height="26" rx="8" fill="#101014" />

  <!-- скельця -->
  <rect x="18" y="34" width="200" height="96" rx="14" fill="url(#lens)" />
  <rect x="294" y="34" width="200" height="96" rx="14" fill="url(#lens)" />

  <!-- відблиск: саме він робить скло склом, а не чорним прямокутником -->
  <path d="M30 46 h150 L70 118 H30 Z" fill="url(#sheen)" />
  <path d="M306 46 h150 L346 118 H306 Z" fill="url(#sheen)" />

  <!-- обідок -->
  <g fill="none" stroke="#2c2c34" stroke-width="3">
    <rect x="18" y="34" width="200" height="96" rx="14" />
    <rect x="294" y="34" width="200" height="96" rx="14" />
  </g>
</svg>
