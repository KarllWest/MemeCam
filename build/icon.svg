<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d8" stop-opacity="0.95" />
      <stop offset="0.45" stop-color="#ffcf6a" stop-opacity="0.45" />
      <stop offset="1" stop-color="#ffcf6a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0" />
      <stop offset="0.5" stop-color="#fffdf2" stop-opacity="1" />
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#141419" />
  <rect x="8" y="8" width="496" height="496" rx="106" fill="none" stroke="#2a2a34" stroke-width="6" />

  <!-- голова -->
  <path d="M256 132c-64 0-112 46-112 108v42c0 62 48 108 112 108s112-46 112-108v-42c0-62-48-108-112-108z"
        fill="#2e3440" />
  <path d="M256 132c-64 0-112 46-112 108v42c0 62 48 108 112 108s112-46 112-108v-42c0-62-48-108-112-108z"
        fill="none" stroke="#3d4657" stroke-width="7" />

  <!-- сяйво навколо очей -->
